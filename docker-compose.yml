version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recon-engine-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/recon_db
      - SPRING_DATASOURCE_USERNAME=recon_user
      - SPRING_DATASOURCE_PASSWORD=recon_pass
      - DB_DRIVER=org.postgresql.Driver
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: recon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: recon_db
      POSTGRES_USER: recon_user
      POSTGRES_PASSWORD: recon_pass
    ports:
      - "5432:5432"
    volumes:
      - recon_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon_user -d recon_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  recon_pg_data:
